<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reels AutoScroller</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <h1>Reels AutoScroller</h1>
      <div class="header-actions">
        <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme" title="Toggle theme"></button>
        <button id="settings-btn" class="icon-btn" aria-label="Open settings" title="Settings">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <div id="status" class="status">
      <span class="status-dot"></span>
      <span id="platform-status">Unsupported platform</span>
    </div>

    <section class="section">
      <button id="toggle-btn" class="btn btn-primary" disabled>Enable Auto Scroll</button>
      <button id="pause-btn" class="btn btn-secondary hidden" disabled>Pause Auto Scroll</button>
      <label class="inline-setting" for="auto-enable-toggle">
        <span>Auto-enable on supported pages</span>
        <span class="switch">
          <input type="checkbox" id="auto-enable-toggle" />
          <span class="switch-track"></span>
        </span>
      </label>
    </section>

    <div class="divider"></div>

    <section class="section">
      <div class="control-header">
        <label for="playback-speed">Playback Speed</label>
        <input id="playback-speed-input" type="number" min="0.1" max="5" step="0.1" class="speed-input" />
      </div>
      <input type="range" id="playback-speed" min="0.1" max="5" step="0.1" class="slider" />
      <p class="hint">Adjust video playback speed</p>
    </section>

    <div class="divider"></div>

    <section class="section">
      <h2 class="section-title">Quick Links</h2>
      <div class="platform-grid">
        <button id="instagram-shortcut" class="platform-btn">Instagram</button>
        <button id="youtube-shortcut" class="platform-btn">YouTube</button>
        <button id="tiktok-shortcut" class="platform-btn">TikTok</button>
        <button id="facebook-shortcut" class="platform-btn">Facebook</button>
      </div>
    </section>

    <footer class="footer">
      <span id="version-text"></span>
      <a id="settings-link" href="#">Settings</a>
    </footer>

    <script src="../shared/constants.js"></script>
    <script src="../shared/utils.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
