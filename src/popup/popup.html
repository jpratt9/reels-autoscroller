<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reels AutoScroller</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="status" class="status">
      <span class="dot"></span>
      <span id="platform-status">Unsupported platform</span>
    </div>

    <button id="toggle-btn" class="mode wide" disabled>
      <span class="ico" id="toggle-ico"></span>
      <span id="toggle-lbl">Enable Auto Scroll</span>
    </button>

    <button id="pause-btn" class="mode wide pause hidden" disabled>
      <span class="ico" id="pause-ico"></span>
      <span id="pause-lbl">Pause Auto Scroll</span>
    </button>

    <div class="opts">
      <div class="row">
        <span class="lbl">Speed</span>
        <input type="range" id="playback-speed" min="0.1" max="5" step="0.1" />
        <span id="speed-val" class="val">1.0×</span>
      </div>
      <label class="row check">
        <input type="checkbox" id="auto-enable-toggle" />
        <span>Auto-enable on supported pages</span>
      </label>
    </div>

    <div class="divider"></div>

    <div class="modes">
      <button class="mode" id="instagram-shortcut">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5.5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1.1" fill="currentColor" stroke="none"/></svg></span>
        <span>Instagram</span>
      </button>
      <button class="mode" id="youtube-shortcut">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="3.5"/><path d="M10.5 9.3l4.3 2.7-4.3 2.7z" fill="currentColor" stroke="none"/></svg></span>
        <span>YouTube</span>
      </button>
      <button class="mode" id="tiktok-shortcut">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4v9.8a3.6 3.6 0 1 1-3.6-3.6"/><path d="M14 4.2c.4 2.2 2 3.8 4.2 4.1"/></svg></span>
        <span>TikTok</span>
      </button>
      <button class="mode" id="facebook-shortcut">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 21v-8h2.3l.4-2.9h-2.7V8.2c0-.8.3-1.4 1.5-1.4h1.3V4.2c-.6-.1-1.4-.2-2.2-.2-2.3 0-3.7 1.3-3.7 3.8v2.3H8v2.9h2.1v8z" fill="currentColor" stroke="none"/></svg></span>
        <span>Facebook</span>
      </button>
    </div>

    <div class="foot">
      <span id="version-text"></span>
      <a id="settings-link" href="#">Settings</a>
    </div>

    <script src="../shared/constants.js"></script>
    <script src="../shared/utils.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
